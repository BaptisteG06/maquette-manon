<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page introuvable · Maisons de Manon</title>
<meta name="description" content="Cette page n'existe pas. Retour à l'accueil de la maquette Maisons de Manon, agence du Cannet."><meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><style>@font-face{font-family:Jost;src:url(fonts/jost.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Cormorant;src:url(fonts/cormorant.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Cormorant;src:url(fonts/cormorant-i.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
:root{--bg:#0c1517;--panel:#112023;--txt:#ece8e2;--mut:#b4b8b3;--kick:#cabaad;--brand:#187c8d;--brand-d:#126673;--ln:rgba(236,232,226,.16);
 --sans:Jost,"Avenir Next","Helvetica Neue",Arial,sans-serif;--serif:Cormorant,"Cormorant Garamond",Georgia,serif;--ease:cubic-bezier(.22,1,.36,1);--pad:clamp(20px,4vw,56px)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--txt);font:300 17.5px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3,h4,p,figure,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
h1,h2{font-weight:300;text-transform:uppercase;letter-spacing:.14em;line-height:1.18;text-wrap:balance}
h2{font-size:clamp(28px,3.1vw,42px)}
h3{font:400 13px/1.5 var(--sans);letter-spacing:.24em;color:var(--kick)}
p{text-wrap:pretty}
.wrap{width:100%;max-width:1360px;margin-inline:auto;padding-inline:var(--pad)}
.center{text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:#fff;color:#000;padding:10px 16px}.skip:focus{top:12px}
:focus-visible{outline:2px solid var(--kick);outline-offset:3px}
.kick{font:500 12.5px/1.6 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--kick);margin-bottom:22px}
.kick span{letter-spacing:.1em}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.32em;line-height:1.4;color:var(--txt)}
.serif.big{font-size:clamp(26px,2.6vw,36px);line-height:1.3}
.serif-xl{font:italic 400 clamp(40px,5.4vw,76px)/1.08 var(--serif);text-transform:none;letter-spacing:0}
.petit{font-size:15px;color:var(--mut)}
.sec{padding-block:clamp(88px,11vw,160px)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,110px);align-items:end}
.g2 > div > p + p{margin-top:22px}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:50px;padding:14px 28px;border:1px solid rgba(236,232,226,.55);color:#fff;text-decoration:none;
 font:500 12.5px/1.2 var(--sans);letter-spacing:.24em;text-transform:uppercase;background:transparent;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .35s var(--ease)}
.btn i{font-style:normal;letter-spacing:0;transition:transform .25s}
.btn:hover{background:#fff;color:var(--bg);border-color:#fff}.btn:hover i{transform:translateX(4px)}
.btn.plein{background:var(--brand);border-color:var(--brand)}.btn.plein:hover{background:#fff;color:var(--bg);border-color:#fff}
.lien{display:inline-flex;gap:12px;align-items:center;font:500 12.5px/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--kick);text-decoration:none;padding-block:12px;white-space:nowrap}
.lien i{font-style:normal;transition:transform .25s}.lien:hover i{transform:translateX(5px)}

/* barre */
.bar{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;gap:32px;height:88px;padding-inline:var(--pad);transition:background .45s,height .45s var(--ease)}
.bar.on{background:var(--brand);height:70px}
.logo{display:block;width:132px;flex:none;transition:width .45s var(--ease)}.bar.on .logo{width:112px}
.logo svg{width:100%;height:auto;display:block}.logo svg [fill]{fill:#fff}
.menu{display:flex;gap:30px;margin-inline:auto}
.menu a{font:400 12.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;padding:12px 0;color:#fff;opacity:.9}
.menu a:hover{opacity:1;color:var(--kick)}.bar.on .menu a:hover{color:#fff;opacity:.7}
.menu .m-tel{display:none}
.bar-r{display:flex;align-items:center;gap:22px;font:400 12.5px/1 var(--sans);letter-spacing:.18em}
.langs{display:flex;align-items:center;gap:12px}.langs span{color:#fff;padding:12px 2px}.langs a{color:rgba(255,255,255,.75);text-decoration:none;padding:16px 4px}.langs a:hover{color:#fff}
.tel{text-decoration:none;color:#fff;padding:12px 0}
.burger{display:none;width:48px;height:48px;background:none;border:0;cursor:pointer;position:relative;color:#fff}
.burger span:not(.sr-only){position:absolute;left:12px;right:12px;height:1px;background:currentColor;transition:transform .3s}
.burger span:nth-child(1){top:19px}.burger span:nth-child(2){top:28px}
.menu-o .burger span:nth-child(1){transform:translateY(4.5px) rotate(45deg)}.menu-o .burger span:nth-child(2){transform:translateY(-4.5px) rotate(-45deg)}

/* hero */
.hero-scroll{height:calc(var(--n) * 55vh + 100vh);position:relative}
.hero{position:sticky;top:0;height:100svh;min-height:560px;overflow:hidden;background:#091113}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s var(--ease);will-change:opacity}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.07);transition:transform 6s var(--ease)}
.slide.on{opacity:1}.slide.on img{transform:scale(1)}
.hero-txt{will-change:transform;position:absolute;inset:auto 0 0;padding-bottom:clamp(64px,10vh,110px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.45),0 0 48px rgba(0,0,0,.35)}
.hero h1{font-weight:400;font-size:clamp(36px,5.2vw,74px);letter-spacing:.13em;line-height:1.15;margin-bottom:26px}
.hero .lede{max-width:500px;font-size:18px;line-height:1.6;margin-bottom:34px;font-weight:450}
.hero .btn{border-color:rgba(255,255,255,.8);text-shadow:none}
.hero .cap{margin-top:30px;font:500 12.5px/1 var(--sans);letter-spacing:.3em}
.dots{position:absolute;inset:auto 0 0;display:flex;justify-content:flex-end;gap:6px;padding-bottom:clamp(64px,10vh,110px)}
.dot{width:44px;height:44px;background:none;border:0;cursor:pointer;position:relative}
.dot::after{content:"";position:absolute;left:8px;right:8px;top:21px;height:2px;background:rgba(255,255,255,.45);transition:background .3s}
.dot.on::after{background:#fff}

/* ouverture */
.ouv{padding-block:clamp(96px,12vw,170px);text-align:center}
.ouv .serif-xl{margin-bottom:46px}
.ouv-p{max-width:760px;margin:0 auto}.ouv-p p+p{margin-top:18px}
.ouv-p p:first-child{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:clamp(64px,8vw,110px)}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px}
.stat .k{font:500 12px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--kick)}
.stat b{display:block;overflow:hidden;font:200 clamp(52px,6vw,84px)/1.05 var(--sans)}
.stat b span{display:block}
.stat .lab{font-size:15px;color:var(--mut);letter-spacing:.04em}
.js .stats .stat b span{transform:translateY(105%);transition:transform 1s var(--ease)}
.js .stats .stat .k,.js .stats .stat .lab{opacity:0;transition:opacity .8s}
.js .stats.in .stat b span{transform:none}.js .stats.in .stat .k,.js .stats.in .stat .lab{opacity:1}
.js .stats .stat:nth-child(2) *{transition-delay:.12s}.js .stats .stat:nth-child(3) *{transition-delay:.24s}.js .stats .stat:nth-child(4) *{transition-delay:.36s}
.js .stats.in .stat .lab{transition-delay:.6s}

/* I mesure */
.mesure .g2{margin-bottom:clamp(56px,7vw,96px)}
.mesure .serif{margin-top:28px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2.6vw,40px);align-items:start}
.trio figure:nth-child(1){margin-top:90px}.trio figure:nth-child(3){margin-top:46px}
.trio img{aspect-ratio:4/5;object-fit:cover;width:100%}
.trio figure:nth-child(1) img{object-position:56% 62%}.trio figure:nth-child(2) img{aspect-ratio:4/3;object-position:50% 68%}.trio figure:nth-child(3) img{object-position:72% 58%}
.trio figcaption{padding-top:16px;font-size:15.5px;color:var(--mut)}
.trio figcaption b{display:block;font-size:26px;color:var(--txt);margin-bottom:2px}

/* II essayage */
.essai{height:540vh;position:relative}
.e-stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;grid-template-columns:minmax(330px,36%) 1fr}
.e-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(236,232,226,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(236,232,226,.045) 1px,transparent 1px);background-size:56px 56px}
.e-num{position:absolute;right:4vw;bottom:2vh;font:italic 400 clamp(180px,30vw,420px)/1 var(--serif);color:rgba(236,232,226,.05);pointer-events:none}
.e-col{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding-top:120px;padding-bottom:120px;padding-right:0;max-width:none}
.e-col h2{font-size:clamp(28px,3vw,42px);margin-bottom:22px}
.e-col .sub{max-width:340px}
.beats{position:relative;min-height:170px}
.beat{position:absolute;inset:auto 0 0;opacity:0;transform:translateY(16px);transition:opacity .6s,transform .8s var(--ease)}
.beat.on{opacity:1;transform:none}
.beat .verb,.beat .lead{font-size:clamp(28px,2.6vw,38px);line-height:1.2;color:var(--kick)}
.beat .lead{color:var(--txt)}.beat .lead strong{font-weight:400;color:var(--kick)}
.beat.end p:not(.lead){margin-top:16px;font-size:16px;color:var(--mut);max-width:420px}
.e-model{position:relative}.e-model canvas{position:absolute;inset:0;width:100%;height:100%}
.e-hud{position:absolute;inset:auto 0 0;display:flex;align-items:center;gap:28px;padding-bottom:34px;max-width:none;font:400 11.5px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.vues{display:flex;gap:22px;margin-left:auto}.vues span{transition:color .3s}.vues span.on{color:var(--kick)}
.ebar{width:120px;height:1px;background:var(--ln);overflow:hidden}.ebar i{display:block;height:100%;background:var(--kick);transform-origin:0 0;transform:scaleX(0)}

/* nos maisons */
.reals .wrap.center{max-width:780px}
.reals .serif{margin:22px 0 14px}
.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-block:clamp(56px,7vw,90px);padding-inline:6px}
.card{position:relative}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover}
.card figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:16px 10px 22px}
.card b{font:400 13.5px/1.3 var(--sans);letter-spacing:.24em}
.card span{font-size:15px;color:var(--mut)}
.card em{flex-basis:100%;font:italic 400 19px/1.3 var(--serif);color:var(--kick)}
.card:nth-child(1) img{object-position:50% 60%}
.reals .btn{margin-bottom:22px}

/* charnière */
.charn{padding-block:clamp(40px,6vw,80px) clamp(88px,10vw,140px);max-width:900px}
.charn .serif-xl{margin-bottom:18px}

/* III envers */
.envers{background:var(--panel)}
.envers .g2{margin-bottom:clamp(40px,5vw,72px)}
.coupe-scroll{height:200vh;position:relative}
.coupe-stick{position:sticky;top:max(80px,calc(50svh - 290px))}
.coupe{width:100%;height:auto;display:block;color:var(--txt);overflow:visible}
.coupe .t{fill:none;stroke:rgba(236,232,226,.82);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--k,0))}
.coupe .sol{stroke:rgba(236,232,226,.45)}
.coupe .a,.coupe .f{stroke:var(--kick)}
.coupe .iso{stroke-dasharray:.012 .01;opacity:var(--k,0);stroke-dashoffset:0}
.coupe .res{stroke:#6fb3bd}
.coupe .l{stroke:rgba(202,186,173,.6);stroke-width:1}
.coupe text{fill:var(--txt);font:400 14px var(--sans);letter-spacing:.18em}
.coupe .lab text{opacity:var(--k,0);transition:opacity .3s}
.coupe .niv{opacity:var(--k,0)}.coupe .niv path{fill:none;stroke:rgba(236,232,226,.6)}.coupe .niv text{fill:var(--mut);font-size:13px;letter-spacing:.06em}
.coupe-f figcaption{margin-top:20px;font-size:15px;color:var(--mut)}.coupe-f figcaption b{display:block;font-size:23px;color:var(--txt)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,4vw,64px);margin-top:clamp(64px,8vw,110px)}
.cols .n{display:block;font:200 46px/1 var(--sans);color:var(--kick);margin-bottom:18px}
.cols h3{color:var(--txt);margin-bottom:12px}
.cols p{color:var(--mut);font-size:16.5px}
.gar{display:block;margin-top:16px;font:500 12px/1.4 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--kick)}

/* IV contrat */
.prix .g2{align-items:start}
.prix h2{margin-bottom:28px}
.liste{margin-top:44px;display:grid;gap:30px}
.liste li{display:grid;grid-template-columns:56px 1fr;gap:6px}
.liste .n{font:200 30px/1.1 var(--sans);color:var(--kick)}
.liste b{display:block;font:400 14px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.liste p{color:var(--mut);font-size:16.5px}
.prix-img{position:sticky;top:110px}
.prix-img img{aspect-ratio:4/5;object-fit:cover;width:100%}
.prix-img figcaption{margin-top:16px;font-size:21px;color:var(--mut)}

/* V terrain */
.terrain{background:var(--panel)}
.terrain .g2{margin-bottom:clamp(48px,6vw,80px)}
.ter-g{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:clamp(32px,5vw,80px);align-items:start}
.ter-g h3{margin-bottom:12px}.ter-g h3:not(:first-child){margin-top:36px}
.ter-g > div > p{color:var(--mut);font-size:16.5px}
.communes{columns:2;column-gap:24px;font-size:15.5px;line-height:1.9;color:var(--txt);margin-bottom:14px}
.carte{width:100%;height:auto;display:block}
.carte .mer{fill:rgba(24,124,141,.2)}
.carte .cote{fill:none;stroke:rgba(202,186,173,.85);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.4s var(--ease)}
.carte .ile{fill:none;stroke:rgba(202,186,173,.6);vector-effect:non-scaling-stroke}
.carte .mer-t{fill:rgba(236,232,226,.55);font:400 15px var(--sans);letter-spacing:.5em;text-anchor:middle}
.carte .pt circle{fill:var(--txt)}.carte .pt text{fill:var(--mut);font:400 14px var(--sans)}
.carte .ag circle{fill:var(--kick)}.carte .ag .halo{fill:none;stroke:var(--kick);opacity:.6}.carte .ag text{fill:var(--kick);font:500 13.5px var(--sans);letter-spacing:.16em}
.carte .pt,.carte .ag{opacity:0;transition:opacity .6s calc(var(--i) * 45ms + .6s)}
.carte-f.in .cote,:not(.js) .carte .cote{stroke-dashoffset:0}.carte-f.in .pt,.carte-f.in .ag{opacity:1}
html:not(.js) .carte .pt,html:not(.js) .carte .ag{opacity:1}
.ou-t{margin:clamp(72px,9vw,120px) 0 30px;color:var(--txt);text-align:center}
.ou{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2.6vw,36px)}
.ou article{display:flex;flex-direction:column}
.ou img{aspect-ratio:3/2;object-fit:cover;width:100%}
.ou h4{font-size:27px;margin:20px 0 8px}
.ou p{color:var(--mut);font-size:16.5px;flex:1;margin-bottom:10px}

/* FAQ */
.faq .g2{align-items:start}
.faq h2{margin-bottom:24px}.faq .g2 > div:first-child > p{color:var(--mut)}
.faq details{border-bottom:1px solid var(--ln)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:24px;padding:24px 0;font-size:18px;font-weight:400}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{flex:none;width:14px;height:14px;position:relative;margin-top:8px}
.faq summary i::before,.faq summary i::after{content:"";position:absolute;left:0;right:0;top:6.5px;height:1px;background:var(--kick);transition:transform .3s}
.faq summary i::after{transform:rotate(90deg)}.faq details[open] summary i::after{transform:none}
.faq details p{padding:0 40px 26px 0;color:var(--mut);font-size:16.5px}

/* final */
.final{background:#091113}
.fin-img{position:relative}.fin-img img{width:100%;aspect-ratio:21/9;object-fit:cover;object-position:44% 55%}
.fin-img figcaption{padding-top:16px;font-size:15px;color:var(--mut)}.fin-img figcaption b{font-weight:400;letter-spacing:.22em;color:var(--txt);font-size:13px}
.fin-img figcaption em{font-size:19px}
.fin-txt{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,110px);padding-block:clamp(72px,9vw,130px)}
.fin-txt h2{margin-bottom:20px}.fin-txt .serif{margin-bottom:22px}.fin-txt p{color:var(--mut)}.fin-txt .serif{color:var(--txt)}
.tel-f{margin-top:26px}.tel-f a{color:var(--txt);white-space:nowrap}
form{display:grid;gap:18px;align-content:start}
label{display:grid;gap:8px;font:500 12px/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--kick)}
input{font:300 17px/1.4 var(--sans);color:var(--txt);background:transparent;border:0;border-bottom:1px solid rgba(236,232,226,.4);padding:12px 0;border-radius:0;min-height:48px;color-scheme:dark}
input::placeholder{color:rgba(236,232,226,.4)}
input:focus,input:focus-within{outline:none;border-bottom-color:var(--kick);box-shadow:0 1px 0 var(--kick)}
form .btn{margin-top:14px;justify-self:start}
.note{min-height:1.5em;font-size:15.5px;color:var(--kick)}

footer{background:#091113;border-top:1px solid var(--ln);padding-block:44px 120px}
.foot{display:grid;grid-template-columns:150px 1fr;gap:40px;align-items:start;font-size:14.5px;color:var(--mut)}
.foot p+p{margin-top:8px}
.logo-f svg{width:130px;height:auto}.logo-f svg [fill]{fill:#fff}
.mbar{display:none}
.p404{min-height:100svh;display:grid;align-content:center;gap:22px}.p404 .logo{width:150px;margin-bottom:30px}.p404 .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}

/* apparitions */
.js .rv,.js .rv-c{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform 1s var(--ease)}
.js .rv.in,.js .rv-c.in{opacity:1;transform:none}
.ln{display:block;overflow:hidden;padding-bottom:.06em}.ln>span{display:block}
.js .rv-t .ln>span{transform:translateY(108%);transition:transform 1.1s var(--ease)}
.js .rv-t .ln:nth-child(2)>span{transition-delay:.1s}.js .rv-t.in .ln>span{transform:none}.rv-t.done .ln{overflow:visible}
.rv-p{overflow:hidden}
.js .rv-p{clip-path:inset(100% 0 0 0);transition:clip-path 1.2s var(--ease)}
.js .rv-p img{transform:scale(1.12);transition:transform 1.6s var(--ease)}

.js .rv-p.in{clip-path:inset(0 0 0 0)}.js .rv-p.in img{transform:none}
.js .carte-f{opacity:1;transform:none}

@media (max-width:1100px){
 .menu{display:none}.burger{display:block}.tel{display:none}
 .menu-o .menu{display:flex;position:fixed;inset:0;z-index:-1;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding:100px var(--pad) 40px;background:var(--brand);margin:0}
 .menu-o .menu a{font-size:16px;padding:14px 0}.menu-o .menu .m-tel{display:block;margin-top:18px}
 .menu-o .bar{background:var(--brand)}
 .e-stage{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
 .e-col{position:static;padding-top:96px;padding-bottom:0;padding-right:var(--pad);display:block}
 .e-col header{margin-bottom:6px}
 .e-stage{grid-template-rows:auto 1fr;padding-bottom:230px}
 .beats{position:absolute;inset:auto var(--pad) 74px;min-height:0;height:140px}
 .beat{inset:0 0 auto}
 .e-model{grid-row:2;min-height:180px}
}
@media (max-width:900px){
 .g2,.fin-txt,.ter-g{grid-template-columns:1fr;align-items:start}
 .stats{grid-template-columns:repeat(2,1fr);row-gap:48px}
 .trio{grid-template-columns:1fr;gap:40px}.trio figure:nth-child(n){margin-top:0}.trio img,.trio figure:nth-child(2) img{aspect-ratio:3/2}
 .grille{grid-template-columns:repeat(2,1fr)}
