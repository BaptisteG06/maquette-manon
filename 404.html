<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page introuvable · Maisons de Manon</title>

<meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>@font-face{font-family:"Instrument Serif";src:url(/fonts/instrument-serif.woff2) format("woff2");font-weight:400;font-display:swap;size-adjust:104%}
@font-face{font-family:"Archivo";src:url(/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
/* Maquette 2 : page éditoriale claire (esprit Midi Mas), identité Maisons de Manon : blanc, bleu du « Manon », beige du « Maisons de ». */
:root{--bg:#fff;--sand:#f6f1ec;--ink:#16353b;--ink-2:#3d5a60;--brand:#187c8d;--brand-d:#0f5560;--beige:#cabaad;--line:rgba(22,53,59,.14);
  --f-t:"Instrument Serif",Georgia,"Times New Roman",serif;--f-b:"Archivo","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.wrap{padding-inline:max(20px,env(safe-area-inset-left,0px));max-width:1320px;margin-inline:auto}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--brand);color:#fff;padding:12px 16px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
h1,h2,h3,h4{font-family:var(--f-t);font-weight:400;line-height:1.04;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(46px,5.4vw,84px)}
h2{font-size:clamp(36px,4.2vw,64px)}
h3{font-size:clamp(26px,2.4vw,34px)}
p{text-wrap:pretty}
.eyebrow{font-family:var(--f-b);font-stretch:112%;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin:0 0 22px}
.eyebrow .num{font-family:var(--f-t);font-size:22px;letter-spacing:0;text-transform:none;margin-right:12px;color:var(--brand)}
.lede{font-size:19px;color:var(--ink-2);max-width:38em;margin:22px 0 0}
.petit{font-size:15px;color:var(--ink-2)}
/* boutons */
.btn{display:inline-block;font-family:var(--f-b);font-stretch:112%;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;background:var(--brand);color:#fff;border:0;border-radius:2px;padding:16px 22px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s,transform .25s var(--ease)}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.btn.ghost:hover{background:var(--brand);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.lien{display:inline-block;padding:12px 0;font-weight:700;font-stretch:112%;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);text-decoration:none;border-bottom:1px solid currentColor}
/* barre : blanche, passe au bleu de la marque au défilement */
.bar{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;gap:20px;padding:12px max(20px,env(safe-area-inset-left,0px));background:#fff;transition:background .4s var(--ease),padding .4s var(--ease),box-shadow .4s}
.logo{display:block;flex:none}
.logo svg{height:56px;width:auto;display:block;transition:height .4s var(--ease)}
.logo svg path,.logo svg ellipse{transition:fill .4s}
.agence{font-size:14px;color:var(--brand);font-stretch:105%}
.menu{display:flex;gap:4px;margin-left:auto}
.menu a{padding:12px 12px;font-size:14px;text-decoration:none;color:var(--ink);transition:color .2s}
.menu a:hover{color:var(--brand)}
.bar-r{display:flex;align-items:center;gap:6px}
.lang{display:inline-block;min-width:44px;line-height:44px;text-align:center;font-weight:700;font-size:13px;letter-spacing:.1em;text-decoration:none;color:var(--brand)}
.bar .btn{padding:13px 18px;font-size:12px}
.bar.on{background:var(--brand);padding-block:6px;box-shadow:0 8px 30px rgba(15,85,96,.18)}
.bar.on .logo svg{height:46px}
.bar.on .logo svg [fill="#187c8d"]{fill:#fff}
.bar.on .agence,.bar.on .menu a,.bar.on .lang{color:#fff}
.bar.on .btn{background:#fff;color:var(--brand)}
.bar.on .btn:hover{background:var(--sand)}
.bar.on :focus-visible{outline-color:#fff}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:clamp(24px,4vw,64px);align-items:center;padding:120px max(20px,env(safe-area-inset-left,0px)) 40px;min-height:100svh}
.hero-txt{padding-left:clamp(0px,2vw,40px)}
.hero-img{position:relative}
.slides{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--sand)}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.4s var(--ease)}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 7s linear}
.slide.on img{transform:scale(1)}
.slide figcaption{position:absolute;left:0;bottom:0;background:#fff;color:var(--ink);font-size:14px;padding:10px 16px}
.dots{display:flex;gap:4px;margin-top:10px}
.dot{width:44px;height:44px;border:0;background:none;cursor:pointer;position:relative;padding:0}
.dot::after{content:"";position:absolute;left:8px;right:8px;top:21px;height:2px;background:var(--line);transition:background .3s}
.dot.on::after{background:var(--brand)}
.note-img{position:absolute;right:0;bottom:12px;margin:0;font-size:13px;color:var(--ink-2)}
/* faits */
.faits{padding-block:clamp(56px,8vw,110px)}
.faits ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.faits li b{display:block;overflow:hidden;padding-bottom:.06em;font-family:var(--f-t);font-weight:400;font-size:clamp(40px,4vw,58px);line-height:1;color:var(--brand)}
.faits li .lab{display:block;margin-top:10px;font-size:15px;color:var(--ink-2);max-width:16em}
.intro{font-family:var(--f-t);font-size:clamp(28px,2.8vw,42px);line-height:1.2;max-width:28em;margin:clamp(56px,7vw,96px) 0 0}
/* sections */
.sec{padding-block:clamp(80px,11vw,160px)}
.sec.alt{background:var(--sand)}
.head{max-width:900px;margin-bottom:clamp(40px,5vw,72px)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.trio figure{margin:0}
.trio img{aspect-ratio:4/5;object-fit:cover;width:100%}
figcaption{font-size:16px;color:var(--ink-2);margin-top:14px}
figcaption b{display:block;font-family:var(--f-t);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:4px}
.prix-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(32px,5vw,80px);align-items:start}
.garanties{list-style:none;margin:0;padding:0;counter-reset:g}
.garanties li{counter-increment:g;padding:26px 0 26px 64px;position:relative;border-top:1px solid var(--line)}
.garanties li::before{content:counter(g,decimal-leading-zero);position:absolute;left:0;top:24px;font-family:var(--f-t);font-size:30px;color:var(--brand)}
.garanties b{font-family:var(--f-t);font-weight:400;font-size:28px;display:block}
.garanties p{margin:6px 0 0;color:var(--ink-2)}
.prix-img{position:relative}
.prix-img figure{margin:0}
.prix-img img{aspect-ratio:4/3;object-fit:cover}
.plan{position:absolute;right:-12px;bottom:110px;width:46%;border:10px solid #fff;box-shadow:0 18px 50px rgba(22,53,59,.16)}
.plan img{aspect-ratio:16/10}
.aside{font-size:16px;color:var(--ink-2);margin:20px 0 0;max-width:30em}
/* pas à pas du chantier (moment signature) : piloté par le défilement, la section reste fixée le temps des 5 étapes */
.pas-scroll{height:calc(var(--n) * 70vh + 100vh);position:relative}
.pas-stick{position:sticky;top:88px}
#chantier.sec{padding-top:clamp(56px,7vw,96px)}
#chantier .head{margin-bottom:32px}
.pas{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:start}
.pas-img{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--sand)}
.pas-img .st{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .7s var(--ease),transform 1.4s var(--ease)}
.pas-img .st.on{transform:none}
.pas-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.45)}
.pas-prog span{display:block;height:100%;width:100%;background:var(--brand);transform-origin:0 50%;transform:scaleX(0)}
.pas-img .st.on{opacity:1}
.pas-list{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:44px 1fr;gap:0 12px;width:100%;text-align:left;font:inherit;color:var(--ink-2);background:none;border:0;border-top:1px solid var(--line);padding:16px 0;cursor:pointer;transition:color .3s}
.step .n{grid-row:1/3;font-family:var(--f-t);font-size:24px;color:var(--beige);transition:color .3s}
.step b{font-family:var(--f-t);font-weight:400;font-size:26px;color:var(--ink-2);line-height:1.1}
.step .d{font-size:15px}
.step.on b,.step:hover b{color:var(--ink)}
.step.on .n{color:var(--brand)}
.step.on{color:var(--ink)}
/* envers */
.envers{background:var(--brand);color:#fff}
.envers h2,.envers .eyebrow,.envers .eyebrow .num,.envers .lede{color:#fff}
.env-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:center}
.env-g figure{margin:0}
.env-g img{aspect-ratio:4/5;object-fit:cover}
.couches{list-style:none;margin:36px 0 0;padding:0}
.couches li{display:grid;grid-template-columns:52px 1fr;padding:20px 0;border-top:1px solid rgba(255,255,255,.3)}
.couches .n{font-family:var(--f-t);font-size:26px}
.couches b{font-family:var(--f-t);font-weight:400;font-size:28px;display:block}
.couches p{margin:4px 0 8px}
.couches .gar{display:inline-block;font-size:13px;font-weight:700;font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;background:#fff;color:var(--brand);padding:6px 10px}
/* galerie */
.galerie{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.galerie figure{margin:0}
.galerie img{width:100%;object-fit:cover;aspect-ratio:4/3}
.g0{grid-column:span 4}.g0 img{aspect-ratio:16/10}
.g1{grid-column:span 2}.g1 img{aspect-ratio:4/5.15}
.g2,.g3{grid-column:span 3}
.g4,.g5{grid-column:span 3}
.galerie figcaption b{font-size:24px}
.galerie+.petit{margin-top:28px}
/* terrain */
.ter-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:center}
.ter-g figure{margin:0}
.ter-g img{aspect-ratio:4/3;object-fit:cover}
.ter-g h3{margin-top:40px}
.zone{margin:12px 0 0;color:var(--ink-2)}
.ou-t{margin:clamp(72px,9vw,120px) 0 36px}
.ou{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.ou article{background:#fff;padding:0 0 24px}
.ou img{aspect-ratio:16/10;object-fit:cover;width:100%}
.ou h4{font-size:28px;margin:22px 22px 8px}
.ou p{margin:0 22px 14px;color:var(--ink-2)}
.ou .lien{margin-left:22px}
/* faq */
.faq{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,80px)}
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{display:block;list-style:none;cursor:pointer;padding:22px 40px 22px 0;font-weight:600;font-size:18px;position:relative;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:4px;top:18px;font-size:24px;color:var(--brand);transition:transform .3s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:0 0 22px;color:var(--ink-2);max-width:38em}
/* final */
.final{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--brand);color:#fff}
.fin-img{margin:0;min-height:100%}
.fin-img img{width:100%;height:100%;object-fit:cover}
.fin-txt{padding:clamp(56px,7vw,110px) clamp(24px,5vw,80px)}
.final h2,.final .eyebrow,.final .lede{color:#fff}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:34px}
label{display:block;font-size:13px;font-weight:700;font-stretch:112%;letter-spacing:.1em;text-transform:uppercase}
input{display:block;width:100%;margin-top:8px;font:inherit;font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink);background:#fff;border:1px solid #fff;border-radius:2px;padding:13px 14px;min-height:50px}
input:focus,input:focus-within{outline:2px solid #fff;outline-offset:2px}
form .btn{grid-column:1/-1;background:#fff;color:var(--brand);margin-top:8px}
form .btn:hover{background:var(--sand)}
.note{grid-column:1/-1;margin:0;min-height:1.5em}
.tel{margin:24px 0 0}
.tel a{display:inline-block;padding:10px 0;font-weight:700}
.final :focus-visible{outline-color:#fff}
footer{display:grid;grid-template-columns:auto 1fr;gap:40px;padding-block:56px 64px;font-size:14px;color:var(--ink-2)}
footer p{margin:0 0 10px;max-width:60em}
.logo-f svg{height:64px;width:auto}
.mbar{display:none}
/* apparitions (une variante par section) */
.js .rv,.js .rv-c{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.js .rv.in,.js .rv-c.in{opacity:1;transform:none}
.js .rv-t .ln{display:block;overflow:hidden;padding-bottom:.08em}
.js .rv-t .ln>span{display:block;transform:translateY(105%);transition:transform 1s var(--ease)}
.js .rv-t.in .ln>span{transform:none}
.js .rv-t.done .ln{overflow:visible}
.js .rv-p{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--ease)}
.js .rv-p.in{clip-path:inset(0 0 0 0)}
@media (min-width:901px){.js .ter-g figure.rv-p,.js .env-g figure.rv-p{clip-path:inset(0 100% 0 0)}.js .ter-g figure.rv-p.in,.js .env-g figure.rv-p.in{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.js .rv,.js .rv-c,.js .rv-t .ln>span,.js .rv-p{opacity:1!important;transform:none!important;clip-path:none!important;transition:none!important}.slide img{transform:none!important;transition:none}.slide{transition:none}}
/* tablette / mobile */
@media (max-width:1100px){.menu,.agence{display:none}}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:96px;min-height:0;gap:28px}
  .hero-img{order:-1}
  .hero-txt{padding-left:0}
  .note-img{position:static;margin-top:4px}
  .faits ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 20px}
  .trio,.prix-g,.pas,.env-g,.ter-g,.ou,.faq,.final{grid-template-columns:1fr}
  .trio img{aspect-ratio:4/3}
  .plan{position:relative;right:auto;bottom:auto;width:70%;margin:-60px 12px 0 auto}
  .galerie{grid-template-columns:1fr}
  .galerie figure{grid-column:auto}
  .galerie img,.g0 img,.g1 img{aspect-ratio:4/3}
  .env-g img{aspect-ratio:4/3}
  .fin-img img{aspect-ratio:4/3;height:auto}
  form{grid-template-columns:1fr}
  footer{grid-template-columns:1fr}
  .mbar{display:grid;grid-template-columns:2fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:55;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
  .mbar .btn{text-align:center;min-height:48px;padding:16px 10px;letter-spacing:.06em}
  footer{padding-bottom:120px}
  .bar-r>.btn{display:none}
  .logo svg{height:46px}
  .bar.on .logo svg{height:40px}
  .eyebrow{font-size:15px;letter-spacing:.08em}
  .lede{font-size:17.5px}
  .petit,.faits li .lab,.step .d,.slide figcaption,.note-img,footer,.aside{font-size:15px}
  summary{font-size:17px}
}

/* stats : apparition en cascade (pas de compteur) */
.js .stat b>span{display:inline-block;transform:translateY(110%);transition:transform 1s var(--ease)}
.js .stat .lab{opacity:0;transform:translateY(10px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.js .stats.in .stat b>span{transform:none}
.js .stats.in .stat .lab{opacity:1;transform:none}
.js .stats .stat:nth-child(2) *{transition-delay:.12s}.js .stats .stat:nth-child(3) *{transition-delay:.24s}.js .stats .stat:nth-child(4) *{transition-delay:.36s}
.js .stats .stat .lab{transition-delay:.45s}.js .stats .stat:nth-child(2) .lab{transition-delay:.57s}.js .stats .stat:nth-child(3) .lab{transition-delay:.69s}.js .stats .stat:nth-child(4) .lab{transition-delay:.81s}
/* toutes les images : rideau + léger zoom arrière à l'apparition */
.js .rv-p{overflow:hidden}
.js .rv-p img{transform:scale(1.12);transition:transform 1.8s var(--ease)}
.js .rv-p.in img{transform:none}
.js .pas-img.rv-p img.st{transform:scale(1.04)}
.js .pas-img.rv-p img.st.on{transform:none}
@media (prefers-reduced-motion:reduce){.js .stat b>span,.js .stat .lab,.js .rv-p img{transform:none!important;opacity:1!important;transition:none!important}}
@media (max-width:900px){
  .pas-scroll{height:calc(var(--n) * 60vh + 100vh)}
  .pas-stick{top:70px}
  .pas{gap:12px}
  #chantier .head{margin-bottom:16px}
  #chantier .head .lede{display:none}
  #chantier h2{font-size:32px}
  #chantier .eyebrow{margin-bottom:10px}
  .step{padding:9px 0}
  .step b{font-size:22px}
  .step .d{display:none}
  .step.on .d{display:block}
}

/* contrastes AA : sur fond sable, sur-titres en bleu profond ; numéros d'étapes inactifs lisibles */
.sec.alt .eyebrow,.sec.alt .eyebrow .num{color:var(--brand-d)}
.step .n{color:#6f8a8f}

/* haut de page : fixé le temps des 4 photos, qui défilent au scroll */
.hero-scroll{height:calc(var(--n) * 55vh + 100vh);position:relative}
.hero{position:sticky;top:0}
@media (max-width:900px){.hero-scroll{height:calc(var(--n) * 45vh + 100vh)}.hero{min-height:100svh;align-content:start}}
@media (max-width:900px){
  .hero{padding-top:74px;gap:18px}
  .slides{aspect-ratio:3/2}
  .hero-img{position:relative}
  .dots{position:absolute;right:0;top:0;margin:0;background:#fff;gap:0}
  .note-img{display:none}
  .hero-txt .eyebrow{margin-bottom:12px}
  .hero-txt .lede{margin-top:14px}
  .hero-txt .actions{display:none}
  .hero-scroll .hero h1{font-size:clamp(36px,10.4vw,46px)}
}
/* cartes « Où en êtes-vous ? » : liens alignés en bas, quelle que soit la longueur du texte */
.ou article{display:flex;flex-direction:column}
.ou article p{flex:1 0 auto}
.ou .lien{align-self:flex-start}
/* cadrages : formats plus proches de la photo et sujet recentré */
.trio img{aspect-ratio:4/3}
.env-g img{aspect-ratio:1/1}
img[src*="chambre-"]{object-position:56% 62%}
img[src*="table-"]{object-position:50% 68%}
img[src*="terrasse-"]{object-position:72% 58%}
img[src*="brique-"]{object-position:50% 62%}
img[src*="mas-"]{object-position:52% 55%}
.fin-img img{object-position:44% 50%}
